<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/images/Logo-Tunotes.png">
    <meta name="description" content="TuNotes — platform catatan kuliah cerdas untuk mahasiswa Indonesia.">
    <title>Dashboard - TuNotes</title>
    <link rel="stylesheet" href="../assets/css/Dashboard.css" />
    <script src="https://unpkg.com/akar-icons-fonts"></script>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
</head>

<body>

    <header class="top-header">
        <a href="Dashboard.html" class="top-header__logo">
            <img src="../assets/images/Logo-Tunotes.png" alt="TuNotes Icon">
        </a>

        <form class="search-bar" action="#" method="GET">
            <i class="ai-search"></i>
            <input type="search" name="query" placeholder="Cari catatan, mata kuliah, atau dosen...">
        </form>

        <div class="user-actions">
            <button class="action-btn" aria-label="Notifikasi">
                <i class="ai-bell"></i>
                <span class="badge" data-notif-badge>3</span>
            </button>
            <button class="action-btn" aria-label="Pesan">
                <i class="ai-envelope"></i>
                <span class="badge" data-message-badge>2</span>
            </button>
            <div class="user-menu">
                <img src="../assets/images/user1.png" alt="Avatar" class="user-avatar" data-user-avatar>
                <span id="userMenuName" data-user-name>…</span>
                <i class="ai-chevron-down"></i>
            </div>
        </div>
    </header>

    <aside class="sidebar-nav">
        <nav class="main-nav">
            <ul>
                <li>
                    <a href="Dashboard.html" class="nav-link active">
                        <i class="ai-home-alt1"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li>
                    <a href="MyNotes.html" class="nav-link">
                        <i class="ai-file"></i>
                        <span>My Notes</span>
                    </a>
                </li>
                <li>
                    <a href="MyFavorites.html" class="nav-link">
                        <i class="ai-heart"></i>
                        <span>Favorit</span>
                    </a>
                </li>
                <li>
                    <a href="UploadNotes.html" class="nav-link">
                        <i class="ai-cloud-upload"></i>
                        <span>Upload Notes</span>
                    </a>
                </li>
                <li>
                    <a href="NotesAI.html" class="nav-link">
                        <i class="fi fi-rr-robot"></i>
                        <span>Notes AI</span>
                    </a>
                </li>
                <li>
                    <a href="NotesRead.html" class="nav-link">
                        <i class="ai-folder"></i>
                        <span>Notes Read</span>
                    </a>
                </li>
                <li>
                    <a href="StudyList.html" class="nav-link">
                        <i class="ai-schedule"></i>
                        <span>Study List</span>
                    </a>
                </li>
                <li>
                    <a href="Profil.html" class="nav-link">
                        <i class="ai-person"></i>
                        <span>Profil</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="logout">
            <a href="#" id="logoutLink" class="nav-logout"><i class="ai-sign-out"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="main-content-header">
            <section class="welcome-banner">
                <h1 id="greeting">Halo !</h1>
                <p>Siap belajar lebih cerdas hari ini?</p>
            </section>
            <nav class="content-tabs">
                <button class="tab-btn active" data-sort="newest">Terbaru</button>
                <button class="tab-btn" data-sort="popular">Populer</button>
                <button class="tab-btn" data-sort="rating">Rekomendasi AI</button>
            </nav>
        </div>
        <div class="notes-grid" id="notesGrid"></div>
    </main>

    <aside class="sidebar-right">
        <h3>Progress Belajar</h3>
        <div class="progress-card">
            <div class="progress-header">
                <span>Catatan Dibaca</span>
                <span id="progressNumber">0/20</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
            <p id="progressMessage">Memuat progress…</p>
        </div>
    </aside>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/modal.js"></script>
    <script src="../assets/js/user-header.js"></script>
    <script src="../assets/js/dashboard.js"></script>
</body>

</html>
