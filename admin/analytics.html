<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/images/Logo-Tunotes.png">
    <meta name="description" content="TuNotes — platform catatan kuliah cerdas untuk mahasiswa Indonesia.">
  <title>Analitik — TuNotes Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body data-page="analytics" data-title="Analitik">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="header" id="header"></header>
      <div class="content">
        <div class="page-head">
          <div>
            <h1 class="page-title">Analitik Keberhasilan</h1>
            <p class="page-desc">Visualisasi pengguna aktif harian, bulanan, dan total catatan tersimpan</p>
          </div>
          <span class="badge badge-info">Read-Only</span>
        </div>

        <div class="stats-grid" id="analyticsStats"></div>

        <div class="grid-2 mb-6">
          <div class="card">
            <div class="card-header"><div class="card-title">Pengguna Aktif Harian</div></div>
            <div class="card-body"><div class="chart-container"><canvas id="dauChart"></canvas></div></div>
          </div>
          <div class="card">
            <div class="card-header"><div class="card-title">Tren Pembuatan Catatan</div></div>
            <div class="card-body"><div class="chart-container"><canvas id="notesChart"></canvas></div></div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-header"><div class="card-title">Pengguna Aktif Bulanan</div></div>
            <div class="card-body"><div class="chart-container"><canvas id="mauChart"></canvas></div></div>
          </div>
          <div class="card">
            <div class="card-header"><div class="card-title">Mata Kuliah Terpopuler</div></div>
            <div class="card-body" style="padding:0">
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Mata Kuliah</th><th>Catatan</th><th>Pengguna</th></tr></thead>
                  <tbody id="coursesBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const s = DATA.stats;
      document.getElementById('analyticsStats').innerHTML = `
        <div class="stat-card"><div class="stat-icon blue">${ICONS.users}</div>
          <div><div class="stat-value">${s.dau.toLocaleString('id-ID')}</div><div class="stat-label">Aktif Harian (DAU)</div><div class="stat-change up">↑ 5.2%</div></div></div>
        <div class="stat-card"><div class="stat-icon green">${ICONS.activity}</div>
          <div><div class="stat-value">${s.mau.toLocaleString('id-ID')}</div><div class="stat-label">Aktif Bulanan (MAU)</div><div class="stat-change up">↑ 12.8%</div></div></div>
        <div class="stat-card"><div class="stat-icon purple">${ICONS.fileText}</div>
          <div><div class="stat-value">${s.totalNotes.toLocaleString('id-ID')}</div><div class="stat-label">Total Catatan</div><div class="stat-change up">↑ 8.3%</div></div></div>
        <div class="stat-card"><div class="stat-icon yellow">${ICONS.trendingUp}</div>
          <div><div class="stat-value">${s.retention}%</div><div class="stat-label">Retention Rate</div><div class="stat-change up">↑ 3.1%</div></div></div>
      `;

      document.getElementById('coursesBody').innerHTML = DATA.popularCourses.map(c => `
        <tr><td>${escapeHtml(c.name)}</td><td>${c.notes}</td><td>${c.users.toLocaleString('id-ID')}</td></tr>
      `).join('');

      const days = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
      new Chart(document.getElementById('dauChart'), {
        type: 'bar',
        data: { labels: days, datasets: [{ label: 'DAU', data: [1850,2100,2250,1980,2156,1650,1420], backgroundColor: 'rgba(66,133,244,.7)', borderRadius: 6 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,grid:{color:'#f0f0f0'}},x:{grid:{display:false}}} }
      });
      const months = ['Jan','Feb','Mar','Apr','Mei','Jun'];
      new Chart(document.getElementById('notesChart'), {
        type: 'line',
        data: { labels: months, datasets: [{ label: 'Catatan Baru', data: [320,480,520,610,580,650], borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,.1)', fill: true, tension: .4, pointRadius: 4, pointBackgroundColor: '#22c55e' }] },
        options: { responsive: true, maintainAspectRatio: false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,grid:{color:'#f0f0f0'}},x:{grid:{display:false}}} }
      });
      new Chart(document.getElementById('mauChart'), {
        type: 'bar',
        data: { labels: months, datasets: [{ label: 'MAU', data: [5200,5800,6500,7100,7800,8432], backgroundColor: 'rgba(139,92,246,.7)', borderRadius: 6 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,grid:{color:'#f0f0f0'}},x:{grid:{display:false}}} }
      });
    });
  </script>
</body>
</html>
